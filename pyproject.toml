[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "trinca"
version = "0.1.0"
description = "Estúdio desktop de vídeos de curiosidades com três IAs"
requires-python = ">=3.11"
dependencies = [
    "PySide6-Essentials>=6.10,<7",
    "keyring>=25,<26",
    "anthropic>=2.9,<3",
    "google-genai>=3.3,<4",
    "playwright>=1.50,<2",
    "yt-dlp>=2026.10",
    "imageio-ffmpeg>=0.6",
    "edge-tts>=7",
    "faster-whisper>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.gui-scripts]
trinca = "trinca.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
trinca = ["assets/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
